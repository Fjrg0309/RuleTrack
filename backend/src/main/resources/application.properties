spring.application.name=ruletrack

# Multipart upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# =============================================
# PostgreSQL DataSource
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ruletrack
spring.datasource.username=${DB_USERNAME:ruletrack}
spring.datasource.password=${DB_PASSWORD:ruletrack}
spring.datasource.driver-class-name=org.postgresql.Driver
# Allow the app to start even if PostgreSQL is not immediately available
spring.datasource.hikari.initializationFailTimeout=-1

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# JWT
# =============================================
app.jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1mb3ItcnVsZXRyYWNrLWNoYW5nZS1pbi1wcm9kdWN0aW9u}
app.jwt.expiration-ms=86400000

# =============================================
# LLM API (OpenAI-compatible)
# =============================================
app.llm.api-url=${LLM_API_URL:https://api.deepseek.com/v1}
app.llm.api-key=${LLM_API_KEY:sk-605da05d460f4ad6a3df00f6de725bc1}
app.llm.model=${LLM_MODEL:deepseek-chat}

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =============================================
# Server
# =============================================
server.port=8080
