server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permitir archivos grandes (PDFs, DOCXs)
    client_max_body_size 500M;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Archivos estáticos con caché agresiva (Angular los hashea en producción)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Módulos ES (.mjs) – necesario para el worker de PDF.js
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy inverso hacia el backend — API REST
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Proxy inverso hacia el backend — Swagger UI
    location /swagger-ui/ {
        proxy_pass ${BACKEND_URL}/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /swagger-ui.html {
        proxy_pass ${BACKEND_URL}/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /v3/ {
        proxy_pass ${BACKEND_URL}/v3/;
        proxy_set_header Host $host;
    }

    # SPA fallback: todas las rutas sirven index.html (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
