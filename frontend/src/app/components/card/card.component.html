<div class="card__row">
  <div class="card__info">
    <h3 class="card__name">{{ titulo }}</h3>
  </div>
  <div class="card__actions">
    @if (visibilidad) {
      <span class="card__badge">{{ visibilidad }}</span>
    }
    <button class="btn btn--primary" (click)="onDownload()">Descargar</button>
  </div>
</div>
