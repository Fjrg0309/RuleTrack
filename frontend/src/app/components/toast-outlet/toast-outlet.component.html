<div class="toast-stack" aria-live="assertive" aria-atomic="false">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [class]="'toast toast--' + toast.type" role="alert">
      <span class="toast__bar"></span>
      <span class="toast__message">{{ toast.message }}</span>
      <button class="toast__close" aria-label="Cerrar" (click)="toastService.dismiss(toast.id)">&#10005;</button>
    </div>
  }
</div>
