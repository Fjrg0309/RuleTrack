<section class="profile">
  <div class="profile__banner">
    <h1 class="profile__title">Perfil</h1>
  </div>

  <div class="profile__card">
    <div class="profile__grid">
      <div class="profile__cell profile__cell--header">
        <span class="profile__label">Nombre completo</span>
      </div>
      <div class="profile__cell profile__cell--header">
        <span class="profile__label">Fecha de nacimiento</span>
      </div>

      <div class="profile__cell">
        <span class="profile__value">{{ auth.currentUser()?.nombre }} {{ auth.currentUser()?.apellidos }}</span>
      </div>
      <div class="profile__cell">
        <span class="profile__value">{{ auth.currentUser()?.fechaNacimiento }}</span>
      </div>

      <div class="profile__cell profile__cell--header">
        <span class="profile__label">NºOrganizadores</span>
      </div>
      <div class="profile__cell profile__cell--header">
        <span class="profile__label">NºMiembros</span>
      </div>

      <div class="profile__cell">
        <span class="profile__value">{{ org()?.numOrganizadores }}</span>
      </div>
      <div class="profile__cell">
        <span class="profile__value">{{ org()?.numMiembros }}</span>
      </div>
    </div>
  </div>

  <div class="profile__footer">
    <button class="btn btn--profile-outline" (click)="goToPublications()">Publicaciones</button>
  </div>
</section>
