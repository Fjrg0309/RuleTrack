<section class="pub-settings">
  <div class="page-banner">
    <h1 class="page-banner__title">Ajustes de publicación</h1>
  </div>

  @if (errorMsg()) {
    <p class="pub-settings__error">{{ errorMsg() }}</p>
  }

  <!-- URL + actions row -->
  <div class="pub-settings__top-row">
    <input
      class="pub-settings__url-input"
      type="text"
      [value]="url()"
      readonly
      aria-label="URL de la publicación"
    />
    <button
      class="btn btn--primary pub-settings__action-btn"
      (click)="actualizarVersion()"
      [disabled]="!canUpdate"
      [title]="canUpdate ? 'Actualizar versión activa' : 'Solo se puede actualizar la versión activa (PUBLICADO)'"
    >Actualizar versión</button>
    <button class="btn btn--primary pub-settings__action-btn" (click)="confirmDelete()">Borrar publicación</button>
  </div>

  <!-- Settings + description -->
  <div class="pub-settings__body">
    <div class="pub-settings__fields">

      <div class="pub-settings__field">
        <label class="pub-settings__field-label" for="pub-titulo">Título</label>
        <input id="pub-titulo" class="pub-settings__input" type="text" [value]="titulo()" (input)="titulo.set($any($event.target).value)" />
      </div>

      <div class="pub-settings__field">
        <label class="pub-settings__field-label" for="pub-visibilidad">Visibilidad</label>
        <div class="pub-settings__select-wrapper">
          <select id="pub-visibilidad" class="pub-settings__select" [value]="visibilidad()" (change)="visibilidad.set($any($event.target).value)">
            <option value="PUBLICO">Público</option>
            <option value="SOLO_MIEMBROS">Solo para miembros</option>
            <option value="PRIVADO">Privado</option>
          </select>
        </div>
      </div>

      <div class="pub-settings__field">
        <label class="pub-settings__field-label" for="pub-version">Versión activa</label>
        <div class="pub-settings__select-wrapper">
          <select
            id="pub-version"
            class="pub-settings__select"
            [value]="selectedVersionId()"
            (change)="onVersionChange(+$any($event.target).value)"
          >
            @for (v of versiones(); track v.id) {
              <option [value]="v.id">
                {{ v.versionEtiqueta }} ({{ v.estado }})
              </option>
            }
          </select>
        </div>
      </div>

      <button class="btn btn--primary pub-settings__save-btn" (click)="saveChanges()">Guardar cambios</button>
    </div>

    <div class="pub-settings__description-wrapper">
      <span class="pub-settings__field-label">Descripción</span>
      <textarea
        class="pub-settings__textarea"
        [value]="descripcion()"
        (input)="descripcion.set($any($event.target).value)"
        rows="10"
        aria-label="Descripción"
      ></textarea>
    </div>
  </div>

  <!-- Delete confirm modal -->
  @if (showDeleteConfirm()) {
    <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="delete-pub-title">
      <div class="confirm-modal">
        <h2 id="delete-pub-title" class="confirm-modal__title">¿Estás seguro de que quieres borrar la publicación?</h2>
        <div class="confirm-modal__actions">
          <button class="btn btn--danger" (click)="deletePublication()">Sí, borrar</button>
          <button class="btn btn--secondary" (click)="cancelDelete()">No, cancelar</button>
        </div>
      </div>
    </div>
  }
</section>
