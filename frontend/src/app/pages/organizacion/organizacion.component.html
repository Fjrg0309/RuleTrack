<section class="org">
  <div class="org__banner">
    <h1 class="org__title">Organización de {{ auth.currentUser()?.displayName }}</h1>
  </div>

  <div class="org__card">
    <div class="org__row org__row--header">
      <span class="org__label">Nombre</span>
      <span class="org__label">Fecha de fundación</span>
    </div>
    <div class="org__row">
      <span class="org__value">{{ org()?.nombre }}</span>
      <span class="org__value">{{ org()?.anioFundacion }}</span>
    </div>
    <div class="org__row org__row--header">
      <span class="org__label">NºOrganizadores</span>
      <span class="org__label">NºMiembros</span>
    </div>
    <div class="org__row">
      <span class="org__value">{{ org()?.numOrganizadores }}</span>
      <span class="org__value">{{ org()?.numMiembros }}</span>
    </div>
  </div>

  <div class="org__footer">
    <button class="btn btn--primary" (click)="goToPublications()">Publicaciones</button>
  </div>
</section>
