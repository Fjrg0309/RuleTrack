<section class="preview">
  <div class="page-banner">
    <h1 class="page-banner__title">{{ fileName }}</h1>
  </div>

  <div class="preview__content">
    <pre class="preview__text">{{ fileContent }}</pre>
  </div>

  <div class="preview__actions">
    <button class="btn btn--cancel" (click)="cancel()">Volver</button>
    @if (isAfterCorrection) {
      <button class="btn btn--primary" (click)="correctDocument()">Corregir de nuevo</button>
    } @else {
      <button class="btn btn--primary" (click)="correctDocument()">Corregir documento</button>
    }
  </div>
</section>
