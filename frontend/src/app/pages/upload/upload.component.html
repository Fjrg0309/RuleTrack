<section class="upload">
  <div class="upload__banner">
    <h1 class="upload__title">Subir documento</h1>
  </div>

  <div
    class="upload__dropzone"
    [class.upload__dropzone--active]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <p class="upload__dropzone-text">Sube tu archivo en formato pdf, markdown o doc aquí</p>
    <div class="upload__dropzone-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110">
        <defs>
          <linearGradient id="f-body" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#7EC3E8"/>
            <stop offset="100%" stop-color="#3A7FBF"/>
          </linearGradient>
          <linearGradient id="f-tab" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9DD4F0"/>
            <stop offset="100%" stop-color="#3A7FBF"/>
          </linearGradient>
          <linearGradient id="f-arrow" x1="40%" y1="0%" x2="60%" y2="100%">
            <stop offset="0%" stop-color="#E8F5FC"/>
            <stop offset="100%" stop-color="#5AAAD6"/>
          </linearGradient>
        </defs>
        <!-- Folder back body -->
        <path d="M10 46 Q8 44 8 40 L8 38 Q8 32 14 31 L44 31 Q49 31 52 37 L55 43 L98 43 Q103 43 103 49 L103 92 Q103 98 97 98 L13 98 Q7 98 7 92 L7 46 Z" fill="url(#f-body)" opacity="0.6"/>
        <!-- Folder tab (organic curve) -->
        <path d="M10 43 Q9 32 16 29 L40 29 Q47 29 51 36 L56 43 Z" fill="url(#f-tab)"/>
        <!-- Folder front body -->
        <path d="M6 48 Q5 44 9 43 L101 43 Q106 43 105 49 L100 96 Q99 102 93 102 L17 102 Q11 102 10 96 Z" fill="url(#f-body)"/>
        <!-- Upload arrow shaft -->
        <rect x="51" y="14" width="8" height="28" rx="4" fill="url(#f-arrow)"/>
        <!-- Upload arrow head (soft rounded triangle) -->
        <path d="M55 5 Q56 5 63 16 Q65 19 62 19 L58 19 L52 19 L48 19 Q45 19 47 16 Q54 5 55 5 Z" fill="url(#f-arrow)"/>
      </svg>
    </div>
  </div>

  <div class="upload__actions">
    <button class="btn btn--primary" (click)="openFilePicker()">Subir desde dispositivo</button>
  </div>

  @if (fileError()) {
    <p class="upload__error">{{ fileError() }}</p>
  }

  <input
    #fileInput
    type="file"
    accept=".pdf,.md,.doc,.docx,.txt"
    class="upload__file-input"
    (change)="onFileSelected($event)"
  />
</section>
