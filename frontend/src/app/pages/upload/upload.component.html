<section class="upload">
  <div class="upload__banner">
    <h1 class="upload__title">Subir documento</h1>
  </div>

  <div
    class="upload__dropzone"
    [class.upload__dropzone--active]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <p class="upload__dropzone-text">Sube tu archivo en formato pdf, markdown o doc aquí</p>
    <div class="upload__dropzone-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110">
        <defs>
          <linearGradient id="f-body" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#3E9FD4"/>
            <stop offset="100%" stop-color="#1A4D82"/>
          </linearGradient>
          <linearGradient id="f-page" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C8E9F8"/>
            <stop offset="100%" stop-color="#7EC8E8"/>
          </linearGradient>
          <linearGradient id="f-arrow" x1="40%" y1="0%" x2="60%" y2="100%">
            <stop offset="0%" stop-color="#5BB8E0"/>
            <stop offset="100%" stop-color="#1A4D82"/>
          </linearGradient>
          <linearGradient id="f-tab" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3E9FD4"/>
            <stop offset="100%" stop-color="#1A4D82"/>
          </linearGradient>
        </defs>
        <!-- Folder back panel -->
        <rect x="8" y="38" width="94" height="58" rx="7" fill="url(#f-body)" opacity="0.6"/>
        <!-- Folder tab -->
        <path d="M8 38 V30 Q8 24 14 24 H38 Q43 24 46 30 L50 38 Z" fill="url(#f-tab)"/>
        <!-- Folder front panel -->
        <rect x="4" y="44" width="102" height="52" rx="7" fill="url(#f-body)"/>
        <!-- Page inside -->
        <rect x="16" y="50" width="78" height="38" rx="5" fill="url(#f-page)"/>
        <!-- Arrow shaft -->
        <rect x="50" y="10" width="10" height="36" rx="4" fill="url(#f-arrow)"/>
        <!-- Arrow head -->
        <polygon points="55,0 36,22 74,22" fill="url(#f-arrow)"/>
      </svg>
    </div>
  </div>

  <div class="upload__actions">
    <button class="btn btn--primary" (click)="openFilePicker()">Subir desde dispositivo</button>
  </div>

  @if (fileError()) {
    <p class="upload__error">{{ fileError() }}</p>
  }

  <input
    #fileInput
    type="file"
    accept=".pdf,.md,.doc,.docx,.txt"
    class="upload__file-input"
    (change)="onFileSelected($event)"
  />
</section>
